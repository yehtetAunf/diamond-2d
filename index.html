<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Diamond 2D</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-flag">◆</span>
        <span>DIAMOND <b>2D</b></span>
      </div>
      <div class="published">PUBLISHED <span></span></div>
    </header>

    <section class="hero">
      <div class="watermark watermark-one">◆</div>
      <div class="watermark watermark-two">◇</div>
      <div class="ress-label">2D RESS</div>
      <div class="main-number" id="mainNumber"><span>--</span></div>
      <div class="updated" id="updated">✓ Updated -- | --:--:--</div>
    </section>

    <section class="stats">
      <div class="stat-card">
        <small>SET</small>
        <strong id="setValue">--</strong>
      </div>
      <div class="stat-card">
        <small>VALUE</small>
        <strong id="valueValue">--</strong>
      </div>
    </section>

    <section class="slots" id="slots"></section>

    <section class="action-row">
      <button class="outline-btn" id="historyBtn"><span>◷</span> 2D HISTORY</button>
      <button class="live-btn" id="live3dBtn"><span>▶</span> 3D LIVE</button>
    </section>

    <section class="history hidden" id="history">
      <div class="history-title">2D HISTORY</div>
      <div id="historyList"><p>History records will appear here after results are saved.</p></div>
    </section>

    <section class="admin hidden" id="adminPanel">
      <div class="admin-titlebar">
        <span>DIAMOND 2D ADMIN</span>
        <button id="closeAdmin" class="close-admin">×</button>
      </div>
      <div class="admin-card">
        <div class="admin-current">
          <span>CURRENT LIVE</span>
          <b id="adminCurrentResult">--</b>
          <small id="adminCurrentMarket">SET -- · VALUE --</small>
        </div>
        <p class="admin-note">SAVE &amp; PUBLISH မနှိပ်မချင်း User App ရဲ့ Public Result မပြောင်းပါ။</p>
        <label>2D RESULT<input id="adminResult" inputmode="numeric" maxlength="2" placeholder="43"></label>
        <label>SET<input id="adminSet" inputmode="decimal" placeholder="7,952.84"></label>
        <label>VALUE<input id="adminValue" inputmode="decimal" placeholder="89,583.45"></label>
        <button id="saveAdmin" class="save-btn">SAVE &amp; PUBLISH</button>
        <div id="saveMessage" class="save-message"></div>
      </div>
    </section>
  </main>

  <button class="fullscreen-fab" id="fullscreenBtn" aria-label="Full screen">⛶</button>

  <script src="app.js"></script>
</body>
</html>
